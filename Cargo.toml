[workspace]
resolver = "3"
members = [
    "compiler/loom_span",
    "compiler/loom_snapshot",
    "compiler/loom_diagnostics",
    "compiler/loom_lexer",
    "compiler/loom_syntax",
    "compiler/loom_parser",
    "compiler/loom_ast",
    "compiler/loom_resolve",
    "compiler/loom_hir",
    "compiler/loom_types",
    "compiler/loom_check",
    "compiler/loom_mir",
    "compiler/loom_opt",
    "compiler/loom_interp",
    "compiler/loom_codegen_cranelift",
    "compiler/loom_driver",
    "compiler/loom_cli",
    "runtime",
    "tools/loom_fmt",
    "tools/loom_lint",
    "tools/loom_lsp",
    "tools/loom_doc",
    "tools/loom_pkg",
    "xtask",
]

[workspace.package]
version = "0.0.0"
edition = "2024"
rust-version = "1.99"
license = "MIT OR Apache-2.0"
repository = "https://github.com/grootmax/loom"

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }

[profile.release]
debug = "line-tables-only"
